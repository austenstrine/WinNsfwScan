<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Browser Guard Options</title>
    <style>
      body {
        font-family: "Segoe UI", Tahoma, sans-serif;
        margin: 20px;
        max-width: 760px;
      }
      h1 {
        margin: 0 0 16px;
      }
      .grid {
        display: grid;
        grid-template-columns: 260px 1fr;
        gap: 10px 14px;
        align-items: center;
      }
      input {
        padding: 6px 8px;
        border: 1px solid #bbb;
        border-radius: 6px;
      }
      .actions {
        margin-top: 16px;
      }
      button {
        border: 1px solid #bbb;
        background: #f7f7f7;
        border-radius: 6px;
        padding: 8px 12px;
        cursor: pointer;
      }
      #status {
        margin-top: 12px;
        color: #1f4;
      }
      .hint {
        color: #555;
        margin-top: 14px;
      }
      code {
        background: #efefef;
        padding: 2px 4px;
        border-radius: 4px;
      }
    </style>
  </head>
  <body>
    <h1>Browser Guard Options</h1>

    <div class="grid">
      <label for="serverUrl">Detector URL</label>
      <input id="serverUrl" type="text" placeholder="http://127.0.0.1:8765/detect" />

      <label for="confidenceThreshold">Confidence threshold (0..1)</label>
      <input id="confidenceThreshold" type="number" min="0" max="1" step="0.01" />

      <label for="captureQuality">Capture JPEG quality (1..100)</label>
      <input id="captureQuality" type="number" min="1" max="100" step="1" />

      <label for="backPollMs">Back-in-progress poll wait (ms)</label>
      <input id="backPollMs" type="number" min="50" max="5000" step="10" />

      <label for="backCooldownMs">Back cooldown (ms)</label>
      <input id="backCooldownMs" type="number" min="0" max="10000" step="50" />
    </div>

    <div class="actions">
      <button id="saveBtn">Save</button>
    </div>

    <div id="status"></div>

    <p class="hint">
      Start detector server with a fixed port, for example:
      <code>server\\server.exe --model 320n.onnx --resolution 320 --port 8765</code>
    </p>

    <script src="options.js"></script>
  </body>
</html>
