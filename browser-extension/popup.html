<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Browser Guard</title>
    <style>
      body {
        font-family: "Segoe UI", Tahoma, sans-serif;
        margin: 12px;
        width: 280px;
      }
      .row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 10px;
      }
      .status {
        font-size: 12px;
        color: #444;
      }
      button {
        border: 1px solid #bbb;
        background: #f7f7f7;
        border-radius: 6px;
        padding: 6px 10px;
        cursor: pointer;
      }
      button:hover {
        background: #ececec;
      }
      .muted {
        font-size: 11px;
        color: #666;
        line-height: 1.35;
      }
    </style>
  </head>
  <body>
    <div class="row">
      <strong>Browser Guard</strong>
      <button id="toggleBtn">...</button>
    </div>

    <div id="status" class="status">Loading...</div>
    <div style="height: 8px"></div>
    <button id="openOptions">Open options</button>

    <p class="muted">
      Detects genitalia, butts, anuses, and female breasts, then goes back once.
    </p>

    <script src="popup.js"></script>
  </body>
</html>
